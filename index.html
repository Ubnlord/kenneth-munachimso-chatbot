<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Kenneth Munachimso – Personal AI</title>
  <style>
    :root { --bg:#0b0b0f;--surface:#141418;--surface2:#1c1c22;--surface3:#25252d;--border:#2e2e38;--text:#f2f2f7;--text-muted:#8e8e9a;--accent:#00d4ff;--accent-soft:rgba(0,212,255,.12);--success:#30d158;--danger:#ff453a;--radius:18px }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{height:100%}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
    header{background:rgba(20,20,24,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;z-index:10}.avatar{width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0;border:2px solid var(--border);box-shadow:0 0 0 1px rgba(0,212,255,.15)}.avatar img{width:100%;height:100%;object-fit:cover}.header-info h1{font-size:16px;font-weight:600;letter-spacing:-.2px;line-height:1.25}.header-info p{font-size:12px;color:var(--text-muted);margin-top:1px}.header-actions{margin-left:auto;display:flex;gap:8px}.icon-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px}.icon-btn:active{transform:scale(.92);background:var(--surface3)}
    #chat{flex:1;overflow-y:auto;padding:20px 16px 24px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}.message{max-width:86%;padding:13px 16px;border-radius:var(--radius);line-height:1.5;font-size:15.5px;word-wrap:break-word;position:relative}.message.user{align-self:flex-end;background:linear-gradient(135deg,#1e4a75,#163a5c);border-bottom-right-radius:6px}.message.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:6px}.message.error{align-self:flex-start;background:rgba(255,69,58,.12);border:1px solid rgba(255,69,58,.35);color:#ff8a84}.message img.generated{max-width:100%;border-radius:14px;margin-top:10px;display:block}.message .time{font-size:11px;color:var(--text-muted);margin-top:7px;text-align:right;opacity:.8}.typing{display:flex;gap:5px;padding:14px 18px;align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);border-bottom-left-radius:6px}.typing span{width:7px;height:7px;background:var(--text-muted);border-radius:50%;animation:bounce 1.35s infinite ease-in-out both}.typing span:nth-child(1){animation-delay:-.32s}.typing span:nth-child(2){animation-delay:-.16s}@keyframes bounce{0%,80%,100%{transform:scale(.55);opacity:.5}40%{transform:scale(1);opacity:1}}
    .input-area{background:rgba(20,20,24,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:12px 14px 18px;flex-shrink:0}.input-row{display:flex;gap:10px;align-items:flex-end}#userInput{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:24px;padding:13px 18px;color:var(--text);font-size:15.5px;resize:none;max-height:130px;outline:none;font-family:inherit;line-height:1.4}#userInput:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}#userInput::placeholder{color:#666}.send-btn,.img-btn{width:46px;height:46px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;flex-shrink:0}.send-btn{background:var(--accent);color:#000;font-weight:600}.send-btn:disabled{background:#333;color:#666;cursor:not-allowed}.img-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text)}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:100}.modal-overlay.open{display:flex}.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:28px 22px 36px}.modal h2{font-size:19px;font-weight:600;margin-bottom:6px}.modal>p{font-size:13.5px;color:var(--text-muted);margin-bottom:22px;line-height:1.45}.modal a{color:var(--accent);text-decoration:none}.modal label{display:block;font-size:13px;margin-bottom:7px;color:var(--text-muted);font-weight:500}.modal input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:13px 14px;color:var(--text);font-size:14.5px;margin-bottom:18px;outline:none}.modal input:focus{border-color:var(--accent)}.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}.btn{padding:12px 20px;border-radius:12px;border:none;font-size:14.5px;font-weight:560;cursor:pointer}.btn-primary{background:var(--accent);color:#000}.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.status{font-size:13px;margin-top:4px;min-height:18px}.status.ok{color:var(--success)}.status.err{color:var(--danger)}.welcome{text-align:center;padding:48px 20px 30px;color:var(--text-muted)}.welcome .big-avatar{width:78px;height:78px;border-radius:50%;overflow:hidden;margin:0 auto 18px;border:2px solid var(--border)}.welcome .big-avatar img{width:100%;height:100%;object-fit:cover}.welcome h2{color:var(--text);font-size:22px;font-weight:650;margin-bottom:8px}.welcome p{font-size:14.5px;line-height:1.5;max-width:290px;margin:0 auto 26px}.quick-actions{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}.quick-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:22px;font-size:13.5px;cursor:pointer}.hint{font-size:11.5px;color:#555;text-align:center;margin-top:10px}
  </style>
</head>
<body>
<header><div class="avatar"><img src="kenneth-avatar.jpg" alt="Kenneth Munachimso" /></div><div class="header-info"><h1>Kenneth Munachimso</h1><p>Your personal AI assistant</p></div><div class="header-actions"><button class="icon-btn" id="settingsBtn" title="Settings">⚙️</button><button class="icon-btn" id="clearBtn" title="Clear chat">🗑️</button></div></header>
<div id="chat"><div class="welcome" id="welcome"><div class="big-avatar"><img src="kenneth-avatar.jpg" alt="" /></div><h2>Kenneth Munachimso</h2><p>Your personal AI is ready. Ask me anything or generate images.</p><div class="quick-actions"><button class="quick-btn" data-msg="Hello, introduce yourself">Say Hello</button><button class="quick-btn" data-msg="Generate an image of a professional man in a suit smiling confidently">Generate Image</button><button class="quick-btn" data-msg="What can you help me with?">What can you do?</button></div></div></div>
<div class="input-area"><div class="input-row"><button class="img-btn" id="imgBtn" title="Generate Image">🖼️</button><textarea id="userInput" rows="1" placeholder="Message Kenneth..." enterkeyhint="send"></textarea><button class="send-btn" id="sendBtn" disabled>➤</button></div><div class="hint" id="proxyHint">Using Hugging Face via Vercel</div></div>
<div class="modal-overlay" id="settingsModal"><div class="modal"><h2>Settings</h2><p>Paste your Vercel proxy URL below.<br>Example: <code>https://your-project.vercel.app</code></p><label for="proxyUrl">Proxy URL</label><input type="text" id="proxyUrl" placeholder="https://your-project.vercel.app" autocomplete="off" /><label for="chatModel">Chat Model</label><input type="text" id="chatModel" value="openai/gpt-oss-120b" /><label for="imageModel">Image Model</label><input type="text" id="imageModel" value="black-forest-labs/FLUX.1-schnell" /><div class="status" id="statusMsg"></div><div class="modal-actions"><button class="btn btn-secondary" id="closeSettings">Cancel</button><button class="btn btn-primary" id="saveSettings">Save</button></div></div></div>
<script>
const DEFAULT_PROXY='';
const DEFAULT_CHAT_MODEL='openai/gpt-oss-120b';
const DEFAULT_IMAGE_MODEL='black-forest-labs/FLUX.1-schnell';
const SYSTEM_PROMPT=`You are Kenneth Munachimso, a helpful and natural personal AI assistant.
Speak in clear, fluent English. Be polite, direct, and useful. Respond as a real person named Kenneth Munachimso.
When the user clearly wants you to create or generate an image, respond with ONLY this exact format on its own line: [GENERATE_IMAGE: detailed visual description here]
For normal conversation, never use the [GENERATE_IMAGE] tag. Stay in character as Kenneth Munachimso at all times.`;
let messages=[];let isGenerating=false;
const chatEl=document.getElementById('chat'),inputEl=document.getElementById('userInput'),sendBtn=document.getElementById('sendBtn'),imgBtn=document.getElementById('imgBtn'),welcomeEl=document.getElementById('welcome'),settingsModal=document.getElementById('settingsModal'),proxyUrlInput=document.getElementById('proxyUrl'),chatModelInput=document.getElementById('chatModel'),imageModelInput=document.getElementById('imageModel'),statusMsg=document.getElementById('statusMsg'),proxyHint=document.getElementById('proxyHint');
function loadSettings(){proxyUrlInput.value=localStorage.getItem('proxy_url')||DEFAULT_PROXY;chatModelInput.value=localStorage.getItem('chat_model')||DEFAULT_CHAT_MODEL;imageModelInput.value=localStorage.getItem('image_model')||DEFAULT_IMAGE_MODEL;updateHint()}
function getProxy(){return(localStorage.getItem('proxy_url')||DEFAULT_PROXY).trim().replace(/\/$/,'')}
function endpoint(path){const p=getProxy();return p?p+path:null}
function updateHint(){const p=getProxy();proxyHint.textContent=p?'Using Vercel proxy':'⚠️ Open ⚙️ and set your Vercel proxy URL';proxyHint.style.color=p?'#555':'#ff8a84'}
function saveSettings(){const url=proxyUrlInput.value.trim().replace(/\/$/,'');localStorage.setItem('proxy_url',url);localStorage.setItem('chat_model',chatModelInput.value.trim()||DEFAULT_CHAT_MODEL);localStorage.setItem('image_model',imageModelInput.value.trim()||DEFAULT_IMAGE_MODEL);statusMsg.textContent=url?'Saved successfully':'Proxy URL cleared';statusMsg.className='status ok';updateHint();setTimeout(()=>{settingsModal.classList.remove('open');statusMsg.textContent=''},700)}
loadSettings();
function addMessage(role,content,isHtml=false){if(welcomeEl)welcomeEl.style.display='none';const div=document.createElement('div');div.className=`message ${role}`;if(isHtml)div.innerHTML=content;else div.textContent=content;const time=document.createElement('div');time.className='time';time.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});div.appendChild(time);chatEl.appendChild(div);chatEl.scrollTop=chatEl.scrollHeight;return div}
function showTyping(){const div=document.createElement('div');div.className='typing';div.id='typingIndicator';div.innerHTML='<span></span><span></span><span></span>';chatEl.appendChild(div);chatEl.scrollTop=chatEl.scrollHeight}function hideTyping(){document.getElementById('typingIndicator')?.remove()}function setLoading(v){isGenerating=v;sendBtn.disabled=v||!inputEl.value.trim();inputEl.disabled=v}
async function parseError(res,kind){const raw=await res.text();let data={};try{data=JSON.parse(raw)}catch{}const msg=data?.error?.message||data?.error||data?.message||raw||`${kind} API error ${res.status}`;return new Error(`${msg} (HTTP ${res.status})`)}
async function callChat(userMessage){const url=endpoint('/api/chat');if(!url)throw new Error('No Proxy URL set. Tap ⚙️ and paste your Vercel URL.');let model=localStorage.getItem('chat_model')||DEFAULT_CHAT_MODEL;const payload={model,messages:[{role:'system',content:SYSTEM_PROMPT},...messages,{role:'user',content:userMessage}],temperature:.8,max_tokens:1024};const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!res.ok)throw await parseError(res,'Chat');const data=await res.json();const content=data?.choices?.[0]?.message?.content;if(!content)throw new Error('Hugging Face returned no message content.');return content}
async function generateImage(prompt){const url=endpoint('/api/image');if(!url)throw new Error('No Proxy URL set. Tap ⚙️ and paste your Vercel URL.');const model=localStorage.getItem('image_model')||DEFAULT_IMAGE_MODEL;const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model,prompt,n:1})});if(!res.ok)throw await parseError(res,'Image');const data=await res.json();const image=data?.data?.[0]?.url;if(!image)throw new Error('Hugging Face returned no image.');return image}
async function sendMessage(text){text=(text||inputEl.value).trim();if(!text||isGenerating)return;inputEl.value='';inputEl.style.height='auto';sendBtn.disabled=true;addMessage('user',text);messages.push({role:'user',content:text});setLoading(true);showTyping();try{const lower=text.toLowerCase();const isImageRequest=/^(generate|create|make)\s+(an?\s+)?image\b|^\/image\b/i.test(text)||lower.includes('generate an image of')||lower.includes('create an image of');if(isImageRequest){let prompt=text.replace(/^\/image\s*/i,'').replace(/^(generate|create|make)\s+(an\s+)?image\s+(of\s+)?/i,'').trim()||text;const imageUrl=await generateImage(prompt);hideTyping();addMessage('bot',`Here’s the image I created for you:<br><img class="generated" src="${imageUrl}" alt="Generated image" />`,true);messages.push({role:'assistant',content:`[Image generated: ${prompt}]`})}else{const reply=await callChat(text);hideTyping();const match=reply.match(/\[GENERATE_IMAGE:\s*(.+?)\]/is);if(match){const imagePrompt=match[1].trim(),cleanReply=reply.replace(/\[GENERATE_IMAGE:\s*.+?\]/is,'').trim();if(cleanReply)addMessage('bot',cleanReply);showTyping();try{const imageUrl=await generateImage(imagePrompt);hideTyping();addMessage('bot',`<img class="generated" src="${imageUrl}" alt="Generated by Kenneth" />`,true);messages.push({role:'assistant',content:(cleanReply||'')+'\n[Image: '+imagePrompt+']'})}catch(e){hideTyping();addMessage('bot error',`Image generation failed: ${e.message}`);messages.push({role:'assistant',content:cleanReply||'Image generation failed.'})}}else{addMessage('bot',reply);messages.push({role:'assistant',content:reply})}}}catch(err){hideTyping();addMessage('bot error',`Error: ${err.message}`)}finally{setLoading(false);inputEl.focus()}}
sendBtn.addEventListener('click',()=>sendMessage());inputEl.addEventListener('input',()=>{sendBtn.disabled=!inputEl.value.trim()||isGenerating;inputEl.style.height='auto';inputEl.style.height=Math.min(inputEl.scrollHeight,130)+'px'});inputEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});imgBtn.addEventListener('click',()=>{const d=window.prompt('Describe the image you want Kenneth to generate:');if(d?.trim())sendMessage('Generate an image of '+d.trim())});document.getElementById('settingsBtn').addEventListener('click',()=>{loadSettings();settingsModal.classList.add('open')});document.getElementById('closeSettings').addEventListener('click',()=>settingsModal.classList.remove('open'));document.getElementById('saveSettings').addEventListener('click',saveSettings);document.getElementById('clearBtn').addEventListener('click',()=>{if(confirm('Clear the entire conversation?')){messages=[];location.reload()}});function bindQuickButtons(){document.querySelectorAll('.quick-btn').forEach(b=>b.addEventListener('click',()=>sendMessage(b.dataset.msg)))}bindQuickButtons();
</script>
</body>
</html>
