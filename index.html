<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Kenneth Munachimso – Personal AI</title>
  <style>
    :root {
      --bg: #0b0b0f;
      --surface: #141418;
      --surface2: #1c1c22;
      --surface3: #25252d;
      --border: #2e2e38;
      --text: #f2f2f7;
      --text-muted: #8e8e9a;
      --accent: #00d4ff;
      --accent-soft: rgba(0, 212, 255, 0.12);
      --user-bg: #1a3a5c;
      --bot-bg: #1a1a20;
      --success: #30d158;
      --danger: #ff453a;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    header {
      background: rgba(20, 20, 24, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      border: 2px solid var(--border);
      box-shadow: 0 0 0 1px rgba(0,212,255,0.15);
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .header-info h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.2px;
      line-height: 1.25;
    }

    .header-info p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .header-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.15s, transform 0.1s;
    }
    .icon-btn:active {
      transform: scale(0.92);
      background: var(--surface3);
    }

    /* Chat area */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .message {
      max-width: 86%;
      padding: 13px 16px;
      border-radius: var(--radius);
      line-height: 1.5;
      font-size: 15.5px;
      word-wrap: break-word;
      position: relative;
      animation: msgIn 0.28s ease-out;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #1e4a75, #163a5c);
      border-bottom-right-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }

    .message.bot {
      align-self: flex-start;
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
    }

    .message.error {
      background: rgba(255, 69, 58, 0.12);
      border: 1px solid rgba(255, 69, 58, 0.35);
      color: #ff8a84;
    }

    .message img.generated {
      max-width: 100%;
      border-radius: 14px;
      margin-top: 10px;
      display: block;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    }

    .message .time {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 7px;
      text-align: right;
      opacity: 0.8;
    }

    /* Typing indicator */
    .typing {
      display: flex;
      gap: 5px;
      padding: 14px 18px;
      align-self: flex-start;
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 6px;
    }
    .typing span {
      width: 7px;
      height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.35s infinite ease-in-out both;
    }
    .typing span:nth-child(1) { animation-delay: -0.32s; }
    .typing span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.55); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Input area */
    .input-area {
      background: rgba(20, 20, 24, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      padding: 12px 14px 18px;
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #userInput {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 13px 18px;
      color: var(--text);
      font-size: 15.5px;
      resize: none;
      max-height: 130px;
      outline: none;
      font-family: inherit;
      line-height: 1.4;
      transition: border-color 0.15s;
    }
    #userInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    #userInput::placeholder {
      color: #666;
    }

    .send-btn, .img-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      flex-shrink: 0;
      transition: transform 0.12s, background 0.15s;
    }

    .send-btn {
      background: var(--accent);
      color: #000;
      font-weight: 600;
    }
    .send-btn:disabled {
      background: #333;
      color: #666;
      cursor: not-allowed;
    }
    .send-btn:not(:disabled):active {
      transform: scale(0.9);
    }

    .img-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .img-btn:active {
      transform: scale(0.9);
      background: var(--surface3);
    }

    /* Settings modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
      padding: 0;
    }
    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 480px;
      padding: 28px 22px 36px;
      animation: slideUp 0.28s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    .modal h2 {
      font-size: 19px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .modal > p {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-bottom: 22px;
      line-height: 1.45;
    }
    .modal a {
      color: var(--accent);
      text-decoration: none;
    }

    .modal label {
      display: block;
      font-size: 13px;
      margin-bottom: 7px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .modal input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 14px;
      color: var(--text);
      font-size: 14.5px;
      margin-bottom: 18px;
      outline: none;
      transition: border-color 0.15s;
    }
    .modal input:focus {
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 8px;
    }

    .btn {
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      font-size: 14.5px;
      font-weight: 560;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--accent);
      color: #000;
    }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .status {
      font-size: 13px;
      margin-top: 4px;
      min-height: 18px;
    }
    .status.ok { color: var(--success); }
    .status.err { color: var(--danger); }

    /* Welcome */
    .welcome {
      text-align: center;
      padding: 48px 20px 30px;
      color: var(--text-muted);
      animation: msgIn 0.4s ease-out;
    }
    .welcome .big-avatar {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      overflow: hidden;
      margin: 0 auto 18px;
      border: 2px solid var(--border);
      box-shadow: 0 0 0 4px rgba(0,212,255,0.08);
    }
    .welcome .big-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .welcome h2 {
      color: var(--text);
      font-size: 22px;
      font-weight: 650;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }
    .welcome p {
      font-size: 14.5px;
      line-height: 1.5;
      max-width: 290px;
      margin: 0 auto 26px;
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      justify-content: center;
    }
    .quick-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 22px;
      font-size: 13.5px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .quick-btn:active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    /* Small helper text under input */
    .hint {
      font-size: 11.5px;
      color: #555;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <header>
    <div class="avatar"><img src="kenneth-avatar.jpg" alt="Kenneth Munachimso" /></div>
    <div class="header-info">
      <h1>Kenneth Munachimso</h1>
      <p>Your personal AI assistant</p>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="settingsBtn" title="Settings">⚙️</button>
      <button class="icon-btn" id="clearBtn" title="Clear chat">🗑️</button>
    </div>
  </header>

  <div id="chat">
    <div class="welcome" id="welcome">
      <div class="big-avatar"><img src="kenneth-avatar.jpg" alt="" /></div>
      <h2>Kenneth Munachimso</h2>
      <p>Your personal AI is ready. Ask me anything or generate images.</p>
      <div class="quick-actions">
        <button class="quick-btn" data-msg="Hello, introduce yourself">Say Hello</button>
        <button class="quick-btn" data-msg="Generate an image of a professional man in a suit smiling confidently">Generate Image</button>
        <button class="quick-btn" data-msg="What can you help me with?">What can you do?</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <button class="img-btn" id="imgBtn" title="Generate Image">🖼️</button>
      <textarea id="userInput" rows="1" placeholder="Message Kenneth..." enterkeyhint="send"></textarea>
      <button class="send-btn" id="sendBtn" disabled>➤</button>
    </div>
    <div class="hint" id="proxyHint">Set your Proxy URL in Settings</div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <h2>Settings</h2>
      <p>
        Paste your Vercel (or Cloudflare) proxy URL below.<br>
        Example: <code>https://your-project.vercel.app</code>
      </p>
      
      <label for="proxyUrl">Proxy URL</label>
      <input type="text" id="proxyUrl" placeholder="https://your-project.vercel.app" autocomplete="off" />

      <label for="chatModel">Chat Model</label>
      <input type="text" id="chatModel" value="grok-4.6" />

      <label for="imageModel">Image Model</label>
      <input type="text" id="imageModel" value="grok-imagine-image-2.0" />

      <div class="status" id="statusMsg"></div>

      <div class="modal-actions">
        <button class="btn btn-secondary" id="closeSettings">Cancel</button>
        <button class="btn btn-primary" id="saveSettings">Save</button>
      </div>
    </div>
  </div>

  <script>
    // ============ CONFIG ============
    // Replace this with your real Cloudflare Worker URL after deploying
    const DEFAULT_PROXY = '';   // e.g. 'https://kenneth-bot.yourname.workers.dev'

    const SYSTEM_PROMPT = `You are Kenneth Munachimso, a helpful and natural personal AI assistant.

Speak in clear, fluent English. Be polite, direct, and useful. Respond as a real person named Kenneth Munachimso.

Image generation:
When the user clearly wants you to create or generate an image, respond with ONLY this exact format on its own line (nothing else before or after the tag if possible):
[GENERATE_IMAGE: detailed visual description here]

Make the description vivid, specific, and high-quality so the image model can produce something excellent. Include style, lighting, composition when useful.

For normal conversation, never use the [GENERATE_IMAGE] tag.

Stay in character as Kenneth Munachimso at all times.`;

    // ============ STATE ============
    let messages = [];
    let isGenerating = false;

    // ============ DOM ============
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const imgBtn = document.getElementById('imgBtn');
    const welcomeEl = document.getElementById('welcome');
    const settingsModal = document.getElementById('settingsModal');
    const proxyUrlInput = document.getElementById('proxyUrl');
    const chatModelInput = document.getElementById('chatModel');
    const imageModelInput = document.getElementById('imageModel');
    const statusMsg = document.getElementById('statusMsg');
    const proxyHint = document.getElementById('proxyHint');

    // ============ INIT ============
    function loadSettings() {
      proxyUrlInput.value = localStorage.getItem('proxy_url') || DEFAULT_PROXY;
      chatModelInput.value = localStorage.getItem('xai_chat_model') || 'grok-4.6';
      imageModelInput.value = localStorage.getItem('xai_image_model') || 'grok-imagine-image-2.0';
      updateHint();
    }

    function getProxy() {
      return (localStorage.getItem('proxy_url') || DEFAULT_PROXY).replace(/\/$/, '');
    }

    // Detect if it's a Vercel URL so we can use the correct paths
    function getChatEndpoint() {
      const proxy = getProxy();
      if (!proxy) return null;
      if (proxy.includes('vercel.app')) return proxy + '/api/chat';
      return proxy + '/api/chat';
    }

    function getImageEndpoint() {
      const proxy = getProxy();
      if (!proxy) return null;
      if (proxy.includes('vercel.app')) return proxy + '/api/image';
      return proxy + '/api/image';
    }

    function updateHint() {
      const p = getProxy();
      if (!p) {
        proxyHint.textContent = '⚠️ Set your Proxy URL in Settings first';
        proxyHint.style.color = '#ff8a84';
      } else {
        proxyHint.textContent = p.includes('vercel.app') ? 'Using Vercel proxy' : 'Using proxy';
        proxyHint.style.color = '#555';
      }
    }

    function saveSettings() {
      const url = proxyUrlInput.value.trim().replace(/\/$/, '');
      localStorage.setItem('proxy_url', url);
      localStorage.setItem('xai_chat_model', chatModelInput.value.trim() || 'grok-4.6');
      localStorage.setItem('xai_image_model', imageModelInput.value.trim() || 'grok-imagine-image-2.0');
      statusMsg.textContent = url ? 'Saved successfully' : 'Worker URL cleared';
      statusMsg.className = 'status ok';
      updateHint();
      setTimeout(() => {
        settingsModal.classList.remove('open');
        statusMsg.textContent = '';
      }, 700);
    }

    loadSettings();

    // ============ UI HELPERS ============
    function addMessage(role, content, isHtml = false) {
      if (welcomeEl) welcomeEl.style.display = 'none';

      const div = document.createElement('div');
      div.className = `message ${role}`;
      
      if (isHtml) {
        div.innerHTML = content;
      } else {
        div.textContent = content;
      }

      const time = document.createElement('div');
      time.className = 'time';
      time.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      div.appendChild(time);

      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'typing';
      div.id = 'typingIndicator';
      div.innerHTML = '<span></span><span></span><span></span>';
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    function setLoading(loading) {
      isGenerating = loading;
      sendBtn.disabled = loading || !inputEl.value.trim();
      inputEl.disabled = loading;
    }

    // ============ API CALLS (through Worker) ============
    async function callChat(userMessage) {
      const endpoint = getChatEndpoint();
      if (!endpoint) {
        throw new Error('No Proxy URL set. Tap ⚙️ and paste your Vercel (or Cloudflare) URL.');
      }

      const model = localStorage.getItem('xai_chat_model') || 'grok-4.6';

      const payload = {
        model: model,
        messages: [
          { role: 'system', content: SYSTEM_PROMPT },
          ...messages,
          { role: 'user', content: userMessage }
        ],
        temperature: 0.8,
        max_tokens: 1024
      };

      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || err.error || `API error ${res.status}`);
      }

      const data = await res.json();
      return data.choices[0].message.content;
    }

    async function generateImage(prompt) {
      const endpoint = getImageEndpoint();
      if (!endpoint) {
        throw new Error('No Proxy URL set. Tap ⚙️ and paste your Vercel (or Cloudflare) URL.');
      }

      const model = localStorage.getItem('xai_image_model') || 'grok-imagine-image-2.0';

      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: model,
          prompt: prompt,
          n: 1
        })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || err.error || `Image API error ${res.status}`);
      }

      const data = await res.json();
      return data.data[0].url;
    }

    // ============ MAIN SEND ============
    async function sendMessage(text) {
      text = (text || inputEl.value).trim();
      if (!text || isGenerating) return;

      inputEl.value = '';
      inputEl.style.height = 'auto';
      sendBtn.disabled = true;

      addMessage('user', text);
      messages.push({ role: 'user', content: text });

      setLoading(true);
      showTyping();

      try {
        const lower = text.toLowerCase();
        const isImageRequest = 
          lower.startsWith('generate an image') ||
          lower.startsWith('generate image') ||
          lower.startsWith('create an image') ||
          lower.startsWith('make an image') ||
          lower.startsWith('/image') ||
          lower.includes('generate an image of') ||
          lower.includes('create an image of');

        if (isImageRequest) {
          let promptText = text
            .replace(/^\/image\s*/i, '')
            .replace(/^(generate|create|make)\s+(an\s+)?image\s+(of\s+)?/i, '')
            .trim();

          if (!promptText) promptText = text;

          const imageUrl = await generateImage(promptText);
          hideTyping();

          const html = `Here’s the image I created for you:<br><img class="generated" src="${imageUrl}" alt="Generated image" />`;
          addMessage('bot', html, true);
          messages.push({ role: 'assistant', content: `[Image generated: ${promptText}]` });
        } else {
          const reply = await callChat(text);
          hideTyping();

          const match = reply.match(/\[GENERATE_IMAGE:\s*(.+?)\]/is);
          if (match) {
            const imagePrompt = match[1].trim();
            const cleanReply = reply.replace(/\[GENERATE_IMAGE:\s*.+?\]/is, '').trim();

            if (cleanReply) {
              addMessage('bot', cleanReply);
            }

            showTyping();
            try {
              const imageUrl = await generateImage(imagePrompt);
              hideTyping();
              const html = `<img class="generated" src="${imageUrl}" alt="Generated by Kenneth" />`;
              addMessage('bot', html, true);
              messages.push({ role: 'assistant', content: (cleanReply || '') + '\n[Image: ' + imagePrompt + ']' });
            } catch (imgErr) {
              hideTyping();
              addMessage('bot error', `I tried to generate the image but hit an issue: ${imgErr.message}`);
              messages.push({ role: 'assistant', content: cleanReply || 'Image generation failed.' });
            }
          } else {
            addMessage('bot', reply);
            messages.push({ role: 'assistant', content: reply });
          }
        }
      } catch (err) {
        hideTyping();
        addMessage('bot error', `Error: ${err.message}`);
      } finally {
        setLoading(false);
        inputEl.focus();
      }
    }

    // ============ EVENTS ============
    sendBtn.addEventListener('click', () => sendMessage());

    inputEl.addEventListener('input', () => {
      sendBtn.disabled = !inputEl.value.trim() || isGenerating;
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 130) + 'px';
    });

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    imgBtn.addEventListener('click', () => {
      const description = window.prompt('Describe the image you want Kenneth to generate:');
      if (description && description.trim()) {
        sendMessage('Generate an image of ' + description.trim());
      }
    });

    document.getElementById('settingsBtn').addEventListener('click', () => {
      loadSettings();
      settingsModal.classList.add('open');
    });

    document.getElementById('closeSettings').addEventListener('click', () => {
      settingsModal.classList.remove('open');
    });

    document.getElementById('saveSettings').addEventListener('click', saveSettings);

    document.getElementById('clearBtn').addEventListener('click', () => {
      if (confirm('Clear the entire conversation?')) {
        messages = [];
        chatEl.innerHTML = '';
        const welcome = document.createElement('div');
        welcome.className = 'welcome';
        welcome.id = 'welcome';
        welcome.innerHTML = `
          <div class="big-avatar"><img src="kenneth-avatar.jpg" alt="" /></div>
          <h2>Kenneth Munachimso</h2>
          <p>Your personal AI is ready. Ask me anything or generate images.</p>
          <div class="quick-actions">
            <button class="quick-btn" data-msg="Hello, introduce yourself">Say Hello</button>
            <button class="quick-btn" data-msg="Generate an image of a professional man in a suit smiling confidently">Generate Image</button>
            <button class="quick-btn" data-msg="What can you help me with?">What can you do?</button>
          </div>`;
        chatEl.appendChild(welcome);
        bindQuickButtons();
      }
    });

    function bindQuickButtons() {
      document.querySelectorAll('.quick-btn').forEach(btn => {
        btn.addEventListener('click', () => sendMessage(btn.dataset.msg));
      });
    }
    bindQuickButtons();

    settingsModal.addEventListener('click', (e) => {
      if (e.target === settingsModal) settingsModal.classList.remove('open');
    });
  </script>
</body>
</html>
